name: Sync MIIT NEV Announcements

on:
  schedule:
    # 每周二北京时间 11:00 (UTC 03:00) 自动同步工信部最新新能源车型公告与免购置税目录
    - cron: "0 3 * * 2"
  workflow_dispatch:
    inputs:
      limit:
        description: "抓取最新公告批次数（默认 6 批）"
        required: false
        default: "6"
      apply:
        description: "自动回填已有车型缺失的 miit_filing 字段与官方 references"
        type: boolean
        default: false
      commit_directly:
        description: "直接推送到 main（默认创建 Pull Request 供审核）"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-miit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync MIIT official announcements and tax-exemption catalog
        env:
          INPUT_LIMIT: ${{ inputs.limit || '6' }}
          INPUT_APPLY: ${{ inputs.apply }}
        run: |
          ARGS="--limit ${INPUT_LIMIT} --write-report miit_sync_report.md"
          if [ "$INPUT_APPLY" = "true" ]; then
            ARGS="$ARGS --apply"
          fi
          python3 scripts/sync_miit.py $ARGS

      - name: Rebuild indexes when --apply modified model files
        if: ${{ inputs.apply == true }}
        run: python3 scripts/validate_and_index.py

      - name: Validate catalog and indexes
        run: python3 scripts/validate_and_index.py --check

      - name: Append MIIT sync report to Job Summary
        if: always()
        run: |
          if [ -f miit_sync_report.md ]; then
            cat miit_sync_report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit directly to main (optional)
        if: ${{ inputs.commit_directly == true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ index.json catalog.json README.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(miit): sync MIIT NEV announcements ($(date -u +%Y-%m-%d))"
            git push origin HEAD:main
          fi

      - name: Create Pull Request with changes
        if: ${{ inputs.commit_directly != true }}
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/sync-miit-announcements
          delete-branch: true
          commit-message: "chore(miit): sync MIIT NEV announcements"
          title: "chore(miit): 自动同步工信部新能源车型公告与免购置税目录"
          body-path: miit_sync_report.md
          add-paths: |
            data/
            index.json
            catalog.json
            README.md
