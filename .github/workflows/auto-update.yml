name: Auto Sync Official Car Specs

on:
  schedule:
    # 每周一北京时间 10:00 (UTC 02:00) 自动巡检官网配置表
    - cron: "0 2 * * 1"
  workflow_dispatch:
    inputs:
      brand:
        description: "仅同步指定品牌目录（留空则全量同步，如 xiaopeng / nio / lixiang）"
        required: false
        default: ""
      use_browser:
        description: "启用 Playwright 无头浏览器抓取 SPA 页面"
        type: boolean
        default: true
      commit_directly:
        description: "直接推送到 main（默认创建 Pull Request 供审核）"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        if: ${{ github.event_name == 'schedule' || inputs.use_browser }}
        run: python3 -m playwright install --with-deps chromium

      - name: Run official configurator sync
        env:
          INPUT_BRAND: ${{ inputs.brand }}
          USE_BROWSER: ${{ github.event_name == 'schedule' || inputs.use_browser }}
        run: |
          ARGS="--write-report sync_report.md"
          if [ "$USE_BROWSER" = "true" ]; then
            ARGS="$ARGS --browser"
          fi
          if [ -n "$INPUT_BRAND" ]; then
            ARGS="$ARGS --brand $INPUT_BRAND"
          fi
          python3 scripts/sync_official.py $ARGS

      - name: Rebuild indexes and validate JSON
        run: python3 scripts/validate_and_index.py

      - name: Append sync report to Job Summary
        if: always()
        run: |
          if [ -f sync_report.md ]; then
            cat sync_report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit directly to main (optional)
        if: ${{ inputs.commit_directly == true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ index.json README.md .sync_state.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(data): auto-sync official car specs ($(date -u +%Y-%m-%d))"
            git push origin HEAD:main
          fi

      - name: Create Pull Request with changes
        if: ${{ inputs.commit_directly != true }}
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/auto-sync-official-specs
          delete-branch: true
          commit-message: "chore(data): auto-sync official car specs"
          title: "chore(data): 自动同步国产新能源车官网参数配置"
          body-path: sync_report.md
          add-paths: |
            data/
            index.json
            README.md
            .sync_state.json
